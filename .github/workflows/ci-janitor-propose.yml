name: CI Janitor Propose

# Runs trusted agent code from the default branch only.
# PR checkout is treated as data for analysis; it is never executed with tokens.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: ci-janitor-propose-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  propose:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted agent (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: agent

      - name: Checkout failing PR head as data only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr-workspace
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install trusted agent package
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Propose fix (no mutation)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO_ROOT: ${{ github.workspace }}/pr-workspace
          CI_JANITOR_VALIDATE_CMD: python -m pytest
        run: python -m cifixagent.workflow propose
